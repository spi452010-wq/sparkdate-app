name: sparkdate
description: SparkDate - event-based online video speed dating app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.3
  livekit_client: ^2.3.6
  socket_io_client: ^3.1.6
  clock: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
